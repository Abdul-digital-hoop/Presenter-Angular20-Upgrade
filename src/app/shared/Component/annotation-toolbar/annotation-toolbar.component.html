<div class="annotation-toolbar" 
     [style.right.px]="position.x" 
     [style.top.px]="position.y"
     [class.visible]="isVisible"
     (mousedown)="onMouseDown($event)"
     [style.user-select]="'none'"
     [style.pointer-events]="isDragging ? 'none' : 'auto'">
  
  <!-- Toolbar Header -->
  <div class="toolbar-header" style="cursor: move; user-select: none;">
    <span class="toolbar-title">: : :</span>
    <button class="close-btn" (click)="closeToolbar()" (mousedown)="$event.stopPropagation()" title="Close">
      <svg width="30" height="30" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 7.293l2.146-2.147a.5.5 0 0 1 .708.708L8.707 8l2.147 2.146a.5.5 0 0 1-.708.708L8 8.707l-2.146 2.147a.5.5 0 0 1-.708-.708L7.293 8 5.146 5.854a.5.5 0 1 1 .708-.708L8 7.293z"/>
      </svg>
    </button>
  </div>

  <!-- Main Toolbar Content -->
  <div class="toolbar-content">
    
    <!-- Tools Section -->
    <div class="toolbar-section">
      <!-- <div class="section-title">Tools</div> -->
      <div class="tools-grid">
        <button *ngFor="let tool of tools" 
                class="tool-btn"
                [class.active]="currentTool === tool.id"
                (click)="selectTool(tool.id)"
                [title]="tool.name">
          <span class="tool-icon">{{ tool.icon }}</span>
        </button>
      </div>
    </div>

    <!-- Color & Size Controls -->
    <div class="toolbar-section" *ngIf="toolSupportsColor(currentTool)">
      <div class="controls-row">
        <!-- Color Picker -->
        <div class="control-group">
          <button class="control-btn color-btn" 
                  (click)="toggleColorPicker()"
                  [style.background-color]="getCurrentColor()"
                  title="Color">
          </button>
          
          <!-- Color Picker Panel -->
          <div class="picker-panel color-picker" *ngIf="showColorPicker">
            <div class="color-grid">
              <button *ngFor="let color of colors"
                      class="color-option"
                      [style.background-color]="color"
                      [class.selected]="getCurrentColor() === color"
                      (click)="selectColor(color)">
              </button>
            </div>
          </div>
        </div>

        <!-- Size Picker -->
        <div class="control-group" *ngIf="toolSupportsSize(currentTool)">
          <button class="control-btn size-btn" 
                  (click)="toggleSizePicker()"
                  title="Size">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <circle cx="8" cy="8" [attr.r]="getCurrentSize() > 6 ? 6 : getCurrentSize()"/>
            </svg>
          </button>
          
          <!-- Size Picker Panel -->
          <div class="picker-panel size-picker" *ngIf="showSizePicker">
            <div class="size-options">
              <button *ngFor="let size of sizes"
                      class="size-option"
                      [class.selected]="getCurrentSize() === size.value"
                      (click)="selectSize(size.value)">
                <div class="size-preview" [style.width.px]="size.value * 2" [style.height.px]="size.value * 2"></div>
                <span>{{ size.label }}</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="toolbar-section">
      <div class="action-buttons">
        <button class="action-btn clear-btn" 
                (click)="clearAnnotations()"
                title="Clear All Annotations">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
            <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
          </svg>
          Clear
        </button>

        <button class="action-btn settings-btn" 
                (click)="toggleSettingsPanel()"
                title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
            <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.292-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.292c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
          </svg>
          Settings
        </button>


      </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" *ngIf="showSettingsPanel">
      <div class="setting-item">
        <label class="setting-label">
          <input type="checkbox" 
                 [checked]="settings.persistAcrossSlides"
                 (change)="togglePersistence()">
          <span>Keep annotations when changing slides</span>
        </label>
      </div>
    </div>

  </div>
</div>

<!-- Backdrop for closing panels -->
<div class="annotation-backdrop" 
     *ngIf="showColorPicker || showSizePicker || showSettingsPanel"
     (click)="hideAllPickers()">
</div>
