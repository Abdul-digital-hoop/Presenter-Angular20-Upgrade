    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-height">
            <div class="modal-header d-flex justify-content-between align-items-center">
                <h1 class="modal-title fs-5 mb-0" id="imageUploadContentModalLabel">Upload Image</h1>
                <button type="button" class="btn-close m-0" data-bs-dismiss="modal" aria-label="Close" (click)="CloseModal()"></button>
            </div>
            <div class="row mx-0">
                <div class="design-tab col-4 px-0" [ngClass]="uploadTabNumber == 1? 'active':' '">
                    <h5 class="modal-title mb-0" (click)="selectTabForUpload(1)">Upload</h5>
                </div>
                <div class="design-tab col-4 px-0" [ngClass]="uploadTabNumber == 2? 'active':' '">
                    <h5 class="modal-title mb-0" (click)="selectTabForUpload(2)">Image Library</h5>
                </div>
                <div class="design-tab col-4 px-0" [ngClass]="uploadTabNumber == 3? 'active':' '">
                    <h5 class="modal-title mb-0" (click)="selectTabForUpload(3)">GIF's</h5>
                </div>
            </div>
            <div class="modal-body">
                <div *ngIf="uploadTabNumber == 1">
                    <div class="upload-image-div" appDrag (files)="filesDropped($event)" >
                        <input  class="absolute-image-upload" type="file" class="upload-zindex-click" accept=".png,.jpeg,.jpg,.gif,.webp"
                        data-testid="media-file-input"  (change)="BackgroundImageUpload($event)" (click)="myInputFile.value = null" #myInputFile>
                        <div class="my-4">
                            <img src="/assets/new-icons/image-collection.png" class="img-fluid">
                            <h5 class="modal-title mt-4">Drag and drop or
                                <span class="text-primary"> pick an image</span> from your device to upload.
                                <button type="button" class="btn btn-transparent w-100">
                                </button>
                            </h5>
                            <p class="normal-content-text mb-0">Maximum file size: 2MB.</p>
                            <p class="normal-content-text fs-14 mb-0">.png, .gif, .jpg, and .svg</p>
                        </div>
                    </div>
                </div>
                <div *ngIf="uploadTabNumber == 2">
                    <div class="position-relative">
                      <input type="text" class="form-control remaining-padding" placeholder="Search photos from Unsplash" [(ngModel)]="searchQuery"
                        (input)="searchUnsplashImages()" />
                      <div class="position-absolute-search">
                        <img src="/assets/new-icons/search.svg" class="img-fluid" />
                      </div>
                    </div>
                    <div *ngIf="showErrorMessage" class="alert alert-info mt-3 text-center">
                      {{ errorMessage }}
                    </div>
                    <div #imageContainer class="image-list-container fixed-scroll mt-3" *ngIf="!showErrorMessage">
                      <div class="row me-0 gif-height">
                        <ng-container *ngIf="isUnsplashLoading">
                          <div class="col-3 pe-0 position-relative mb-3 skeleton-item" *ngFor="let skeleton of skeletons"></div>
                        </ng-container>
                        <ng-container *ngIf="!isUnsplashLoading">
                          <div class="col-3 pe-0 position-relative mb-3" *ngFor="let image of images">
                            <div class="image-container" 
                                 (mouseenter)="image.isHovered = true" 
                                 (mouseleave)="image.isHovered = false">
                              <a class="absolute-image-upload" href="javascript:void(0)" (click)="selectUnsplashImage(image)"></a>
                              <img [src]="image.urls.small" class="image-fixed-size" width="400" height="300"/>
                              <span class="image-attribution" [class.show-attribution]="image.isHovered" >
                                Photo by <a [href]="'https://unsplash.com/@' + image.user.username + '?' + unsplashReferral" 
                                   target="_blank" rel="noopener noreferrer">{{image.user.name}}</a> 
                                on <a [href]="'https://unsplash.com/?' + unsplashReferral" 
                                   target="_blank" rel="noopener noreferrer">Unsplash</a>
                              </span>
                            </div>
                          </div>
                        </ng-container>
                      </div>
                    </div>
                  </div>
                <div *ngIf="uploadTabNumber == 3">
                    <div class="position-relative mb-3">
                      <input type="text" class="form-control remaining-padding" placeholder="Search GIFs" [(ngModel)]="searchTerm" (input)="searchGif()">
                      <div class="position-absolute-search">
                        <img src="/assets/new-icons/search.svg" class="img-fluid">
                      </div>
                    </div>
                    <div *ngIf="showErrorMessage" class="alert alert-info mt-3 text-center">
                        {{ errorMessage }}
                      </div>
                    <!-- <div class="d-flex justify-content-center">
                        <span class="spinner-border spinner-border-sm gif-loading" role="status" aria-hidden="true" *ngIf="isLoading"></span>
                      </div> -->
                      <div class="image-list-container fixed-scroll" *ngIf="!showErrorMessage">
                        <div class="row me-0 gif-height">
                          <!-- Skeleton Loading Effect -->
                          <ng-container *ngIf="isLoading">
                            <div class="col-3 pe-0 position-relative mb-3 skeleton-item" *ngFor="let skeleton of skeletons"></div>
                          </ng-container>
                      
                          <!-- GIFs -->
                          <ng-container *ngIf="!isLoading">
                            <div class="col-3 pe-0 position-relative mb-3" *ngFor="let gif of gifs">
                              <a class="absolute-image-upload" href="javascript:void(0)" (click)="selectGif(gif)"></a>
                              <img 
                                [src]="gif.media[0].gif.url" 
                                class="img-fluid image-fixed-size" 
                                alt="GIF" 
                                (load)="onGifLoad(gif)" 
                                *ngIf="!gif.loaded" 
                                width="400" height="300"
                              />
                              <img 
                                [src]="gif.media[0].gif.url" 
                                class="img-fluid image-fixed-size" 
                                alt="GIF" 
                                *ngIf="gif.loaded" 
                                width="400" height="300"
                              />
                            </div>
                          </ng-container>
                        </div>
                      </div>
                                         
                  </div>  
                                
            </div>
        </div>
    </div>
