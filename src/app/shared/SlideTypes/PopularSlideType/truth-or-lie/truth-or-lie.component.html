<div class="d-flex align-items-center border-circles">
   <div class="d-flex align-items-center">
        <div class="blue-circle green-bg" [style.font-family]="slideData?.slideThemes?.themesFonts" ></div>
        <div>
            <img src="assets/svg-icons/truth-tick.svg" alt="close" class="close-icon">
        </div>
   </div> 
   <div class="d-flex align-items-center px-2">
    <div class="yellow-circle red-bg" [style.font-family]="slideData?.slideThemes?.themesFonts" ></div>
        <div>
           <img src="assets/svg-icons/truth-lie.svg" alt="close" class="close-icon">
        </div>
   </div>
</div>

<div id="pie-{{slideDetails?.slideId}}-{{viewfrom}}" class="center-panel-chart">
    <svg width="100%" height="100%" viewBox="0 0 650 250"></svg>
</div>
