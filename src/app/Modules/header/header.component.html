<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledrenamePresentationLabelby="logoutlabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered custom-popup">
        <div class="modal-content content-popup">
            <div class="modal-body d-flex">
                <div class="wi-95">
                    <p class="fw-five">Do you want to sign out of your account?</p>
                </div>
                <div>
                    <button type="button" class="close-folder" data-bs-dismiss="modal" aria-label="Close" (click)="closeLogout()">
                        &times;
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn cancel-button fs-very-low" data-bs-dismiss="modal" (click)="closeLogout()">
                    Cancel
                </button>
                <button type="submit" class="btn logout-button" (click)="logout()">Yes</button>
            </div>
        </div>
    </div>
</div>
