<section class="template-category-section">
    <div class="category-dropdown" (clickOutside)="closeDropdown()">
        <div class="dropdown-header" (click)="toggleDropdown()">
            <span>Categories</span>
            <svg width="20" height="20" [class.rotated]="isDropdownOpen" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <mask id="mask0_1259_59234" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
                    <rect width="20" height="20" fill="#D9D9D9" />
                </mask>
                <g mask="url(#mask0_1259_59234)">
                    <path d="M10.0104 12.4948L5.84375 8.32812L14.1771 8.32812L10.0104 12.4948Z" fill="#1C1B1F" />
                </g>
            </svg>
        </div>
        
        <div class="template-category-templates" *ngIf="isDropdownOpen">
            <div class="search-container">
                <div class="search-input-container">
                    <input type="text" placeholder="Search categories" [(ngModel)]="searchText" (ngModelChange)="onSearchChange()">
                    <div class="icon-container">
                        <svg *ngIf="!searchText" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="search-icon">
                            <path d="M10.9471 15.231C8.39811 15.231 6.33173 13.1646 6.33173 10.6155C6.33173 8.06643 8.39811 6 10.9471 6C13.4961 6 15.5625 8.06643 15.5625 10.6155C15.5625 13.1646 13.4961 15.231 10.9471 15.231Z" stroke="#343434" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M17.6641 18.0013L14.3307 14.668" stroke="#343434" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <svg *ngIf="searchText" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" (click)="clearSearch()" class="close-icon">
                            <path d="M15 5L5 15" stroke="#343434" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M5 5L15 15" stroke="#343434" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="category-list-section">
                <div class="category-list">
                    <div class="fixed-category">
                        <ng-container *ngIf="filteredCategories.length > 0; else noCategories">
                            <ng-container *ngFor="let category of filteredCategories; let i = index">
                                <div *ngIf="i < initialCategoriesToShow || showAllCategories" 
                                    class="category-item"
                                    [class.active]="category?.categoryName === selectedCategory"
                                    (click)="changeCategory(category?.categoryName)">
                                    <span>{{ category?.categoryName }}</span>
                                </div>
                            </ng-container>
                        </ng-container>
                        <ng-template #noCategories>
                            <div class="no-categories-found">
                                <span>No categories found</span>
                            </div>
                        </ng-template>
                    </div>
                    <div class="dropdown-ctgry-menu" *ngIf="cutomerSelectedTemplates">
                        <div class="ctgry-txt active">{{ cutomerSelectedTemplates }}</div>
                    </div>
                    <div class="more-button" (click)="toggleShowAll()">
                        <span>{{ showAllCategories ? 'Less' : 'More' }}</span>
                        <svg width="20" height="20" [class.rotated]="showAllCategories" viewBox="0 0 20 20" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <mask id="mask0_1259_59234" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0"
                                width="20" height="20">
                                <rect width="20" height="20" fill="#D9D9D9" />
                            </mask>
                            <g mask="url(#mask0_1259_59234)">
                                <path d="M10.0104 12.4948L5.84375 8.32812L14.1771 8.32812L10.0104 12.4948Z"
                                    fill="#1C1B1F" />
                            </g>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
