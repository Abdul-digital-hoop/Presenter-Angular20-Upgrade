<div class="template-grid">
<div class="Main-d" *ngIf="userPresentation?.length>0"  [ngStyle]="{'background-color': recentPresentation.length > 0 ? '#F6F7FC' : '#FCFCFC'}">
    <div class="popular-text">
        <div class="populartemplate-text">
            <p>Popular Templates</p>
        </div>
        <div class="selectall">
            <a class="see-all-template" routerLink="/app/templates" [queryParams]="{ isPublished: 'true', selectedCategory: 'All Templates' }">View all
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <mask id="mask0_370_32127" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
                    <rect y="20" width="20" height="20" transform="rotate(-90 0 20)" fill="#D9D9D9"/>
                    </mask>
                    <g mask="url(#mask0_370_32127)">
                    <path d="M14.9896 10L9.98958 15L8.82292 13.8333L11.8229 10.8333L4.15625 10.8333L4.15625 9.16667L11.8229 9.16667L8.82292 6.16667L9.98958 5L14.9896 10Z" fill="#6C6CFF"/>
                    </g>
                    </svg>
            </a>
        </div>
    </div>
    <div class="grid-row skel-main" *ngIf="isSkeleton">
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
    </div>
    <div class="grid-row" *ngIf="!isSkeleton">
        <div class="grid-container" *ngFor="let item of userPresentation.slice(0, 4); let index = index">
            <a class="container-anchor" (click)="openPreviewModal(item,index)">
                <div class="templates-grid d-flex justify-content-center align-items-center z-index-top mb-2 hover-effect"
                     #imgContainer
                    [ngStyle]="{'height': (imgContainer.offsetWidth / 1.77) + 'px'  }">
                    <div class="chart-section">
                        <section id="main-stage" class="middle-content-section">
                        <div class="inside-middle-content">
                            <div class="inside-middle-content" #CenterPanel>
                                <div class="chart-main-content" #OuterScreen>
                                    <div class="dynamic-component center-panel-chart1 position-relative" #InnerScreen
                                        [ngStyle]="{ 'width' : panelWidth, 'height' : panelHeight }">
                                        <div class="remote-chart-content-area" [ngStyle]="{ 'width' : panelWidth}">
                                            <div class="remote-chart-inner-content-area">
                                                <div class="slide-card" 
                                                [appThemes]="item?.template?.slides?.design | slideThemes:item?.template?.presentationThemes">
                                                
                                                    <div class="bs-body-content">
                                                        <ng-container *ngIf="item?.template?.slides?.contentType?.slideContentType != masterSlideTypeName.QUIZ && item?.template?.slides?.slideTypeName !== masterSlideTypeName.ImportDocument && item?.template?.slides?.slideTypeName !== masterSlideTypeName.POWER_POINT && item?.template?.slides?.slideTypeName !== masterSlideTypeName.GoogleSlides && item?.template?.slides?.slideTypeName !== masterSlideTypeName.INSTRUCTION_SLIDE_TYPE">
                                                            <div class="theme-background-image" [ngStyle]="{'background-image': 'url(' + item?.template?.presentationThemes?.themesBackgroundImage?.themeBackgroundImageCroppedUrl + ')','opacity':item?.template?.presentationThemes?.themesBackgroundImage?.themeBackgroundImageCroppedUrl ? item?.template?.presentationThemes?.backgroundColorOpacity:1}"></div>
                                                        </ng-container>
                                                        
                                                        <div class="content-center-panel" [hidden]="isLoading">
                                                            <ng-container *ngIf="item?.template?.presentationThemes?.themesLogo?.logoCroppedUrl">
                                                                <div class="brand-logo" [style.width]="workSpaceService.checkOrientation(item?.template?.presentationThemes?.themesLogo?.croppedposition) =='Landscape'? '15%':'5%'">
                                                                    <div class="logo-icon">
                                                                        <img [src]="item?.template?.presentationThemes?.themesLogo?.logoCroppedUrl" alt="Logo" class="logo-image">
                                                                    </div>
                                                                </div>
                                                              </ng-container>
                                                            <div [ngClass]="getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Image left' || getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Side by side left' ? 'inside-content-panel-left' : 'inside-content-panel-right'">
                                                                
                                                                <div *ngIf="(getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) === 'Image right' || getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) === 'Image left') && item?.template?.slides?.slideTypeName != 'Import Document'"
                                                                    class="background-left-right-image" [ngStyle]="loadBGLayout(item?.template?.slides?.slideTypeName,item?.template?.slides?.contentImage?.croppedUrl)">
                                                                </div>
                                                                <div *ngIf="getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Side by side right' || getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Side by side left'"
                                                                    class="background-slide-by-slide-left-right-image"
                                                                    [ngStyle]="loadBGLayout(item?.template?.slides?.slideTypeName,item?.template?.slides?.contentImage?.croppedUrl)"></div>
                                                                <div [ngClass]="{'background-image-panel-top': getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Image top', 'background-image-panel-bottom': getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Image bottom', 'background-image-panel': getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) != 'Image top' && getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) != 'Image bottom', 'img-opacity': item?.template?.slides?.slideTypeName != 'Import Document' && item?.template?.slides?.slideTypeName !=masterSlideTypeName.POWER_POINT && item?.template?.slides?.slideTypeName !=masterSlideTypeName.GoogleSlides && item?.template?.slides?.slideTypeName !=masterSlideTypeName.INSTRUCTION_SLIDE_TYPE && getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) === 'Full Image' }"
                                                                    >
                                                                    <div *ngIf="getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) === 'Full Image' && item?.template?.slides?.slideTypeName != 'Import Document'" [ngStyle]="{'background-image': 'url(' +item?.template?.slides?.contentImage?.croppedUrl+')','width': '100%','position': 'absolute','height': '100%','opacity':item?.template?.slides?.contentImage?.backgroundImageOpacity, 'background-position': 'center center', 'background-repeat': 'no-repeat', 'background-size': 'cover'}"></div>
                                                                    <div class="inner-top-bottom-image"
                                                                        *ngIf="getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Image top' || getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Image bottom'"
                                                                        [ngStyle]="loadBGLayout(item?.template?.slides?.slideTypeName,item?.template?.slides?.contentImage?.croppedUrl)"></div>
                                                                        <ng-container *ngIf="item?.template?.slides?.slideTypeName == 'Import Document'">
                                                                        <img #slideImage [src]="workSpaceService.changepptImgDataFormat(item?.template?.slides?.slideContentData)" (load)="checkImageOrientation($any($event.target))" draggable="false" class="img-fluid">
                                                                        </ng-container>
                                                                        
                                                                            <div class="remote-inside-chart-area">
                                                                                <ng-container
                                                                                    *ngIf="item?.template?.slides?.slideTypeName != masterSlideTypeName.GoogleSlides && item?.template?.slides?.slideTypeName != masterSlideTypeName.POWER_POINT">
                                                                                    <div class="remote-content-text-area"
                                                                                        [hidden]="isLoading">
                                                                                        <div class="chart-question" [style.width]="
                                                                                        (item?.template?.presentationThemes?.themesLogo?.logoCroppedUrl == null || item?.template?.presentationThemes?.themesLogo?.logoCroppedUrl == '') ? '100%':
                                                                                        (workSpaceService.checkOrientation(item?.template?.presentationThemes?.themesLogo?.croppedposition) == 'Landscape' && (getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Image left' || getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Full Image' || getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Default')) ? '75%':
                                                                                        (workSpaceService.checkOrientation(item?.template?.presentationThemes?.themesLogo?.croppedposition) == 'Portrait'  && (getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Image left' || getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Full Image' || getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Default')) ? '90%':
                                                                                        (workSpaceService.checkOrientation(item?.template?.presentationThemes?.themesLogo?.croppedposition) == 'Landscape' && getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Side by side left')? '75%':
                                                                                        (workSpaceService.checkOrientation(item?.template?.presentationThemes?.themesLogo?.croppedposition) == 'Portrait' && getMasterLayoutData(item?.template?.slides?.design?.slideLayoutId) == 'Side by side left')? '90%':'100%'">
                                                                                            <span class="font-style-template-list" class="font-styling-empty-class">    {{getQuestionData(item?.template)}}</span>
                                                                                        </div>
                                                                                    </div>
                                                                                </ng-container>
                                                                                <!-- (mouseenter)="onTemplateHover(dynamicComponent)" (mouseleave)="onTemplateLeave(dynamicComponent)" -->
                                                                                <div class="remote-chart-content-area" [style.font-size]="item?.template?.slides?.slideTypeName == masterSlideTypeName.SCALES_SLIDE_TYPE ? '17px':'24px'" 
                                                                                [style.marginTop.px]="item?.template?.slides?.slideTypeName == masterSlideTypeName.SCALES_SLIDE_TYPE ? 60:20">
                                                                                    <div [ngClass]="[(item?.template?.slides?.slideTypeName == masterSlideTypeName.OPEN_ENDED_SLIDE_TYPE || item?.template?.slides?.slideTypeName == masterSlideTypeName.QA_QUESTIONS_AND_ANSWER_SLIDE_TYPE)  ? 'remote-dynamic-chart-scroll': 'remote-dynamic-chart']">
                                                                                    <app-dynamic-slide-type
                                                                                    (mouseenter)="onTemplateHover(dynamicComponent)" (mouseleave)="onTemplateLeave(dynamicComponent)"
                                                                                    #dynamicComponent
                                                                                    [activeSlideTypeId]="item?.template?.slides?.slideTypeId"
                                                                                    [activeslideVisualizationId]="item?.template?.slides?.design?.slideVisualizationId"
                                                                                    [slideDetails]="item?.template?.slides"
                                                                                    [template]="item?.template"
                                                                                    [presentationTheme]="item?.template?.presentationThemes"
                                                                                    [viewfrom]="'popular-template'"
                                                                                    [screenOptions]="'presentationScreen'"
                                                                                    [isPresenterEditorScreen]="true"
                                                                                    [isPreview]="true"
                                                                                    ></app-dynamic-slide-type>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        </section>
                    </div>
                </div>
                <div class="main-content ">
                    <div class="Present-n ">
                        <p class="presentation-name">{{ item.templateName }}</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

<app-modal [isShowModal]="isPreviewClicked" (closePreviewModal)="closePreviewModal($event)" modalType="preview">
    <ng-container *ngIf="isPreviewClicked">
      <h4 modalTitle>{{userPreviewData?.templateName}}</h4>
      <app-templates-preview [SlideImage]="userPreviewData?.template?.slides?.slideTypeImage"
        [templateDetails]="userPreviewData" [slideCount]="userPreviewData?.template?.slidesCount"
        [downloadCount]="userPreviewData?.downloadCount" [categoryName]="getCategoryNames()"
        [templateId]="userPreviewData?.templateId" [templateDescription]="userPreviewData?.description"
        [createdBy]="userPreviewData?.customerName" [index]="previewindex" [customerLimitation]="customerLimitationCount">
      </app-templates-preview>
    </ng-container>
  </app-modal>
