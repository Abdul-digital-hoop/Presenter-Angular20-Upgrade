<div class="remote-access-container">
  <div class="remote-access-card">
    <div class="logo-container">
      <img src="/assets/images/product-logo.svg" alt="Slidone Logo" class="logo-img">
      <h1>Remote Access Request</h1>
      <p>Enter your name to request access to this presentation</p>
    </div>

    <div class="form-container">
      <form [formGroup]="remoteAccessForm" (ngSubmit)="requestAccess()">
        <div class="form-group">
          <label for="remoteUserName">Your Name</label>
          <input 
            type="text" 
            id="remoteUserName"
            formControlName="remoteUserName"
            placeholder="Enter your full name"
            [class.ng-invalid]="remoteAccessForm.get('remoteUserName')?.invalid && remoteAccessForm.get('remoteUserName')?.touched"
            [class.ng-touched]="remoteAccessForm.get('remoteUserName')?.touched">
          
          <span class="error-message" *ngIf="remoteAccessForm.get('remoteUserName')?.invalid && remoteAccessForm.get('remoteUserName')?.touched">
            <span *ngIf="remoteAccessForm.get('remoteUserName')?.errors?.['required']">Name is required</span>
            <span *ngIf="remoteAccessForm.get('remoteUserName')?.errors?.['minlength']">Name must be at least 2 characters</span>
          </span>
        </div>

        <button 
          type="submit" 
          class="submit-btn"
          [disabled]="remoteAccessForm.invalid || isRequesting">
          <span *ngIf="!isRequesting">Request Access</span>
          <span *ngIf="isRequesting">Requesting...</span>
        </button>
      </form>
    </div>

    <div class="status-container" *ngIf="requestStatus">
      <div class="status-message" [ngClass]="requestStatus">
        <div *ngIf="requestStatus === 'requesting'">
          <i class="fas fa-spinner fa-spin"></i>
          Sending request...
        </div>
        <div *ngIf="requestStatus === 'pending'">
          <i class="fas fa-clock"></i>
          Request sent! Waiting for presenter approval...
        </div>
        <div *ngIf="requestStatus === 'approved'">
          <i class="fas fa-check-circle"></i>
          Access granted! Redirecting...
        </div>
        <div *ngIf="requestStatus === 'rejected'">
          <i class="fas fa-times-circle"></i>
          Access denied by presenter
        </div>
        <div *ngIf="requestStatus === 'error'">
          <i class="fas fa-exclamation-triangle"></i>
          {{ errorMessage }}
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage && requestStatus !== 'error'">
        {{ errorMessage }}
      </div>
    </div>

    <button 
      type="button" 
      class="reset-btn" 
      (click)="resetForm()"
      *ngIf="requestStatus && requestStatus !== 'approved'">
      Try Again
    </button>
  </div>
</div>
