<header>
    <div class="cstm-header-card">
        <div class="first-part-header">
        <!--  Presentation Actions   -->
            <div class="gap-3 d-flex align-items-center">
                <!-- ========  Back to Home  ============ -->
                <a class="arrow-hover" (click)="backToPresentationList()">
                    <img src="/assets/new-icons/arrow-left.svg" class="common-icon-size" />
                </a>
                <!-- ========  Edit Presentation Name ============ -->
                <app-presentation-name></app-presentation-name>
                <!-- ========  Audience URL ============ -->
                <div class="copy-input-relative align-items-center d-lg-flex d-none w-50" *ngIf="!IntegrationMediumOffice">
                    <input type="text" class="form-control copy-input" [value]="workSpaceService.presentationURL" readonly />
                    <!-- <div class="edit-input-icon">
                                        <img src="/assets/new-icons/edit-icon.svg" class="common-icon-size" />
                                    </div> -->
                    <span class="ms-2 cursor-pointer" (click)="copyToClipboard()">

                </div>
            </div>
            
            <!-- <div class="d-lg-block d-none">
                <button class="btn p-0 mx-3">
                    <img src="/assets/new-icons/redo.svg"/>
                </button>
                <button class="btn p-0 mx-3">
                    <img src="/assets/new-icons/undo.svg"/>
                </button>
            </div> -->
            <div class="d-flex justify-content-between align-items-center">
                <button 
                class="btn btn-secondary d-flex justify-content-between align-items-center me-lg-3 me-1 toggle-button text-nowrap pointer-event remote-pricing-tooltip" 
                [ngClass]="workSpaceService.slideParticipantCount >= 1 || workSpaceService.slideVotersCount >= 1 ? '' : 'disabled'" 
                [ngStyle]="{'cursor': customerPlan?.reset_result ? '' : 'not-allowed'}" 
                [disabled]="((workSpaceService.isTemplate) || !(workSpaceService.slideParticipantCount >= 1 || workSpaceService.slideVotersCount >= 1))"(click)="showPopOver($event)" 
                [attr.data-tooltip]="customerPlan?.reset_result === false ? 'Upgrade your plan to reset presentation results.' : null" [attr.data-bs-placement]="'bottom'">
                    <div class="me-2">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <mask id="mask0_20618_470618" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">

                      </div>        
                    <span *ngIf="!IntegrationMediumOffice">Reset results</span>
            </button>
                <div class="me-3 d-lg-block d-none">
                    <ul class="list-unstyled m-0 d-flex align-items-center avatar-group">
                        <li class="avatar">
                            <div class="user-profile-generater" *ngIf="!profileImageURL">
                                <span class="fw-normal">{{userName}}</span>
                            </div>
                            <div *ngIf="profileImageURL">
                                <img class="profile-image-generator" src="{{profileImageURL}}"/>
                            </div>
                        </li>
                        <!-- <li class="avatar">
                            <img src="/assets/new-icons/plus-round.svg"/>
                        </li> -->
                    </ul>
                </div>
                <!-- <app-share-presenatation></app-share-presenatation>
                <button class="btn p-0 mx-3 d-lg-block d-none">
                    <img src="/assets/new-icons/help.svg"/>
                </button> -->
                <app-presentation-setting (reactionUpdate)="updateReactions($event)"></app-presentation-setting>
                <!-- <app-preview-presentation></app-preview-presentation> -->
                <app-presentation-result></app-presentation-result>
                <app-presentation-present></app-presentation-present>

                    <ul class="dropdown-menu menu-arrow">
                        <li>
                            <a class="dropdown-item" href="javascript:void(0)" data-bs-target="modal" data-bs-toggle="shareModal">
                                <span class="me-2">
                                    <img src="/assets/new-icons/share.svg" width="20" height="20" class="img-fluid">
                                </span>Share
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="javascript:void(0)" (click)="viewResult()">
                                <span class="me-2">
                                    <img src="/assets/new-icons/result.svg" width="20" height="20" class="img-fluid">
                                </span>Result
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="javascript:void(0)" (click)="openPreview()">

                                    </svg>
                                </span>Preview
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="javascript:void(0)">
                                <span class="me-2">
                                    <img src="/assets/new-icons/help.svg" width="20" height="20" class="img-fluid">
                                </span>Help
                            </a>

                    </ul>
                </div>
            </div>
        </div>
    </div>
</header>

<div >
<div *ngIf="isResetSlideAction" class="cstm-popover-result" #toggleDiv>
    <div class="dropdown-content position-tooltip-dropdown" id="popup">
        <div class="reset-pop-dropdown"  >
            <ul class="nav flex-column" *ngIf="!isShowAfterDuplicatePresentation">
                <form id="resetResult" class="reset-result" style="text-align: left;">
                <li>
                
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios1" value="resetPresentation"
                            (change)="onRadioChange($event)" [checked]="selectedOption === 'resetPresentation'">
                        <label class="form-check-label ms-1" for="exampleRadios1">
                            Reset results for presentation
                        </label>
                    </div>
                
                    <div class="form-check w-100 d-flex">
                        <input class="form-check-input" type="radio" name="exampleRadios2" id="exampleRadios2"
                            value="resetPresentationDuplicate" (change)="onRadioChange($event)"
                            [checked]="selectedOption === 'resetPresentationDuplicate'"
                            [disabled]="customerLimitationCount?.balancePresentationLimit <= 0">
                        <label class="form-check-label ms-1" for="exampleRadios2">
                            Duplicate presentation before reset
                        </label>
                        <ng-container *ngIf="customerLimitationCount?.balancePresentationLimit <= 0">
                            <div class="layout-label">
                                <div class="pricing-icon slide-list-hover right-side-bar-tooltip-top" data-tooltip="Need subscription">
                                    <svg xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"
                                        width="0.625rem" height="0.625rem" aria-label="Star" viewBox="0 0 16 16">
                                        <g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd">
                                            <path
                                                d="M7.99993 1.5L10.0572 5.66844L14.6573 6.33688L11.3286 9.58156L12.1144 14.1631L7.99993 12L3.88543 14.1631L4.67123 9.58156L1.34253 6.33688L5.94268 5.66844L7.99993 1.5Z">
                                            </path>
                                        </g>
                                    </svg>
                                </div>
                            </div>
                        </ng-container>
                    </div>
                </li>
                <li>
                    <div class="d-flex ms-7">
                        <button type="button" class="btn btn-secondary  me-2 py-2" (click)="closeResetPopup()">Cancel</button>
                        <button type="button" class="btn btn-primary  py-2" (click)="resetResultPresentation(workSpaceService.presentationId)"><div 
                            class="spinner-border spinner-border-sm small-spinner mx-1"
                            role="status"
                            aria-hidden="true"
                            *ngIf="isLoading"
                          ></div>  Reset results</button>
                    </div>     
                </li>
               
            </form>
            </ul> 
            <ul class="nav flex-column" *ngIf="isShowAfterDuplicatePresentation">
                    <li>
                        <p>The presentation was duplicated without <br>the desired results. Should we proceed with<br> the original or use the duplicate?</p>
                        <div class="d-flex ms-7">
                            <button type="button" class="btn btn-secondary  me-2 py-2" (click)="closeResetPopup()">Continue</button>
                            <button type="button" class="btn btn-primary  py-2" (click)="openDuplicateResetResult()">Open Duplicate</button>
                        </div>     
                    </li>
              </ul>
        </div>
    </div>
</div>    
</div>
