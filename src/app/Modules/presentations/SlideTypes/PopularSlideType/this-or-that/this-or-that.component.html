<div class="thisorthat-main-area" [style.scale]="!this.workSpaceService.presentationMode ? 1 : 1.3">
  <div class="thisorthat-text-area">
    <div class="description-text mb-3 w-30">
      <span class="fs-medium" [style.font-family]="slideTheme?.ThemeFontFamily">{{ options[0]?.OptionTitle }}</span>
    </div>
    <div class="description-text mb-3 w-30">
      <span class="fs-medium" [style.font-family]="slideTheme?.ThemeFontFamily">{{ options[1]?.OptionTitle }}</span>
    </div>
  </div>
  <div class="thisorthat-value-area">
    <div class="text-center px-0 w-30" *ngFor="let item of options | slice:0:2; let i = index">
      <div [ngClass]="thisOrThatValue(i) ? 'selected' : 'unselected'" class="value-container">
        <div class="container">
          <div class="circle" [style.background-color]="item.visualizationColor"
            [style.width]="calculateCircleSize(item.value)" [style.height]="calculateCircleSize(item.value)"></div>
        </div>
        <div class="item-value mt-3">
          <span class="count" [style.color]="ContrastColor === 'black' ? '#4848EF' : (ContrastColor === 'white' ? 'white' : ContrastColor)">
            <!-- Conditionally show content based on slideShowInResults and slideResponseAsPercentage -->
            <ng-container *ngIf="workSpaceService?.slideShowInResults; else defaultZero">
              <span *ngIf="!workSpaceService?.slideResponseAsPercentage">{{ item.value }}</span>
              <span *ngIf="workSpaceService?.slideResponseAsPercentage">
                <ng-container *ngIf="item?.value != 0">{{ calculatePercentage(item.value) | number: '1.0-0'
                  }}%</ng-container>
                <ng-container *ngIf="item?.value == 0">0 %</ng-container>
              </span>
            </ng-container>
            <ng-template #defaultZero>
              <span *ngIf="!workSpaceService?.slideResponseAsPercentage">0</span>
              <span *ngIf="workSpaceService?.slideResponseAsPercentage">0 %</span>
            </ng-template>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
