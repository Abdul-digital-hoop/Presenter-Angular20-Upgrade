<div class="d-flex align-items-center border-circles">
   <div class="d-flex align-items-center">
        <div class="blue-circle green-bg" [style.font-family]="slideData?.slideThemes?.themesFonts" ></div>
        <div>
            <svg xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet" width="20" height="20" aria-label="Checkmark" viewBox="0 0 24 24">
                <g class="green">
                    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </g>
                </g>
            </svg>
        </div>
   </div> 
   <div class="d-flex align-items-center px-2">
    <div class="yellow-circle red-bg" [style.font-family]="slideData?.slideThemes?.themesFonts" ></div>
        <div>
            <svg xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet" width="20" height="20" aria-label="Close" viewBox="0 0 24 24">
                <g class="red">
                    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </g>
                </g>
            </svg>
        </div>
   </div>
</div>

<div id="pie" class="center-panel-chart">
    <svg width="100%" height="100%" viewBox="0 0 650 250"></svg>
</div>
