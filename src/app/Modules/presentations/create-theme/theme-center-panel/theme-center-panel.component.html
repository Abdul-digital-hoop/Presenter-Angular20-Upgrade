<div class="center-panel-container">
    <div class="center-panel-image">
        <div class="center-panel-content" [ngStyle]="{'background-color':this.currentCustomerTheme?.themesBackgroundColor}">
            <div class="chart-container">
            <div class="background-image-div"  [ngStyle]="{'background-image': 'url(' + this._presentationThemeService.customerThemeBackgroundImage + ')','opacity':this.currentCustomerTheme?.backgroundColorOpacity,'border-radius':'10px'}"></div>
                <div class="center-panel-header-actions">
                    <span class="center-panel-header-actions-text" [ngStyle]="{'background-color':this.ContrastColor, 'color':this.emojiContrastColor}">
                        To join, go to : {{environment.AudienceURL}} | #123456
                    </span>
                </div>
                <ng-container *ngIf="_presentationThemeService.customerThemeLogoImage">
                    <div class="brand-logo" [style.width]="_presentationThemeService.logoPositionType =='Landscape'? '10%':'3%'">
                        <div class="logo-icon">
                            <img [src]="_presentationThemeService.customerThemeLogoImage" alt="Logo" class="logo-image">
                        </div>
                    </div> 
                </ng-container>
                <div class="question-text">
                    <span class="chart-text" [ngStyle]="{'font-family':this.currentCustomerTheme?.themesFonts, 'color':this.currentCustomerTheme?.themesFontColor, 
                    'font-weight':this.currentCustomerTheme?.textBold? 'bold':'normal', 'font-style':this.currentCustomerTheme?.textItalic?'italic':'', 
                    'text-decoration': (this.currentCustomerTheme?.textUnderline && this.currentCustomerTheme?.textStrikeout) ? 'underline line-through' : this.currentCustomerTheme?.textUnderline ? 'underline' : this.currentCustomerTheme?.textStrikeout ? 'line-through' : '',
                    'font-size':this.currentCustomerTheme?.fontSize+'px'}">
                        I once designed an entire 50-slide presentation in under 30 minutes using slidea’s advanced design
                        tools and templates, which saved me a lot of time and effort!~
                    </span>
                    
                </div>
                <div class="chart-center">
                    <div class="chart-line" [ngStyle]="{'background-color':this.currentCustomerTheme?.lineClour}"></div>
                    <div class="chart-content">
                        <div class="bar">
                            <div class="bar-inner bar-inner-height-50" [ngStyle]="{'background-color':this.currentCustomerTheme?.themesChartColor[0].color}"></div>
                        </div>
                        <span [ngStyle]="{'font-family':this.currentCustomerTheme?.themesFonts, 'color':this.currentCustomerTheme?.themesFontColor}">Option 1</span>
                    </div>
                    <div class="chart-content">
                        <div class="bar">
                            <div class="bar-inner bar-inner-height-90" [ngStyle]="{'background-color':this.currentCustomerTheme?.themesChartColor[1].color}"></div>
                        </div>
                        <span [ngStyle]="{'font-family':this.currentCustomerTheme?.themesFonts, 'color':this.currentCustomerTheme?.themesFontColor}">Option 2</span>
                    </div>
                    <div class="chart-content">
                        <div class="bar">
                            <div class="bar-inner bar-inner-height-40" [ngStyle]="{'background-color':this.currentCustomerTheme?.themesChartColor[2].color}"></div>
                        </div>
                        <span [ngStyle]="{'font-family':this.currentCustomerTheme?.themesFonts, 'color':this.currentCustomerTheme?.themesFontColor}">Option 3</span>
                    </div>
                    <div class="chart-content">
                        <div class="bar">
                            <div class="bar-inner bar-inner-height-70" [ngStyle]="{'background-color':this.currentCustomerTheme?.themesChartColor[3].color}"></div>
                        </div>
                        <span [ngStyle]="{'font-family':this.currentCustomerTheme?.themesFonts, 'color':this.currentCustomerTheme?.themesFontColor}">Option 4</span>
