<!-- This is the start of the selection -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="modal-title mb-3">Default Themes</h5>
    <button [ngStyle]="{'cursor': customerPlan?.custom_themes ? '' : 'not-allowed',
    'opacity': customerPlan?.custom_themes ? '1' : '0.5'}"  class="btn btn-secondary tooltip-left-custom-themes" 
    (click)="createThemeConditionCheck()" [attr.data-tooltip]="!customerPlan?.custom_themes ? 'Need Subscription' : null">
        <span class="spinner-border spinner-border-sm " role="status" aria-hidden="true"
            *ngIf="isCreateThemeLoader"></span>
        <img src="/assets/new-icons/normal-add.svg" class="img-fluid" *ngIf="!isCreateThemeLoader">
        Create
    </button>
</div>
<div class="row me-0">
    <ng-container *ngIf="isSkeletonLoading">
        <div class="col-6 mb-2" *ngFor="let skeleton of skeletons">
            <div class="position-relative skeleton-item"></div>
        </div>
    </ng-container>
    <ng-container *ngIf="!isSkeletonLoading">
        <ng-container *ngFor="let theme of presentationThemeService.defaultThemes">
            <div class="col-6 pe-0 mb-3" (click)="setDefaultThemeToPresentaion(theme)">
                <div class="slide-list-hover" [ngClass]="workSpceService.currentThemeId === theme?.id ?'theme-active':''">
                    <div class="bg-image-themes"
                        style="background-image: url(&quot;&quot;);background-size: cover;inset: 0px;height: 100%;position: absolute;width: 100%;z-index: 9;border-radius: 5px;">
                    </div>
                    <div class="bg-color-themes"
                        style="inset: 0px;height: 100%;opacity: 1;position: absolute;width: 100%;z-index: 99;border-radius: 5px;"
                        [style.background-color]="theme.themesBackgroundColor"></div>
                    <div class="theme-type-card text-center">
                        <div>
                            <h5 class="theme-title" [style.color]="theme.themesFontColor">{{theme?.themeName}}</h5>
                        </div>
                        <div class="bar-chart w-50 mx-auto">
                            <ng-container *ngFor="let chartcolor of theme.themesChartColor;index as i">
                                <div class="bars" [style.height.%]="chartcolor.height"
                                    [style.background-color]="chartcolor.color"></div>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
    </ng-container>
</div>
<div class="custom-line"></div>
<ng-container *ngIf="presentationThemeService.customerThemes.length > 0">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="modal-title mb-3">My Themes</h5>
    </div>
</ng-container>
<div class="row me-0">
    <ng-container *ngIf="isSkeletonLoading">
        <div class="col-6 mb-2" *ngFor="let skeleton of skeletons">
            <div class="position-relative skeleton-item"></div>
        </div>
    </ng-container>
    <ng-container *ngIf="!isSkeletonLoading">
        <ng-container *ngFor="let theme of presentationThemeService.customerThemes">
            <div class="col-6 pe-0 mb-3" (click)="setDefaultThemeToPresentaion(theme)">
                <div class="slide-list-hover" [ngClass]="workSpceService.currentThemeId === theme?.id ?'theme-active':''">
                    <div class="bg-image-themes" [ngStyle]="{'background-image': 'url(' + theme?.themesBackgroundImage?.themeBackgroundImageCroppedUrl + ')','opacity':theme?.backgroundColorOpacity}"></div>
                    <div class="bg-color-themes" style="inset: 0px;height: 100%;position: absolute;width: 100%;border-radius: 5px;" [style.background-color]="theme.themesBackgroundColor"></div>
                    <div class="theme-type-card text-center">
                        <div class="position-absolute-icon">
                            <button class="btn theme-btn-circle" (click)="showPopover($event,theme)">
                                <img src="/assets/new-icons/three-dot-horz.svg">
                            </button>
                        </div>
                        <div class="theme-name-logo">
                            <h5 class="theme-title" [style.color]="theme.themesFontColor"[style.width]="theme?.themesLogo?.logoCroppedUrl ? '70%':'100%'">{{theme?.themeName}}</h5>
                            <ng-container *ngIf="theme?.themesLogo?.logoCroppedUrl">
                                <div class="brand-logo" [style.width]="checkOrientation(theme?.themesLogo?.croppedposition) =='Landscape'? '20%':'15%'">
                                    <div class="logo-icon">
                                        <img [src]="theme?.themesLogo.logoCroppedUrl" alt="Logo" class="logo-image">
                                    </div>
                                </div> 
                            </ng-container>
                        </div>
                        <div class="bar-chart w-50 mx-auto">
                            <ng-container *ngFor="let chartcolor of theme.themesChartColor;index as i">
                                <div class="bars" [style.height.%]="chartcolor.height"
                                    [style.background-color]="chartcolor.color"></div>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
    </ng-container>
</div>
