<section id="main-stage" class="middle-content-section">
    <div class="inside-middle-content">
        <div class="inside-middle-content" #CenterPanel>
            <div class="chart-main-content" #OuterScreen>
                <div [appThemes]="workSpaceService.slideDesign | slideThemes:null" class="center-panel-chart1 position-relative" #InnerScreen  [ngStyle]="{ 'width' : panelWidth}">
                    <ng-container *ngIf="workSpaceService.slideContentType != workSpaceService.masterSlideTypeName.QUIZ && workSpaceService.activeSlideTypeName !== masterSlideTypeName.ImportDocument && workSpaceService.activeSlideTypeName !== masterSlideTypeName.POWER_POINT && workSpaceService.activeSlideTypeName !== masterSlideTypeName.GoogleSlides && workSpaceService.activeSlideTypeName !== masterSlideTypeName.INSTRUCTION_SLIDE_TYPE">
                        <div class="theme-background-image"
                            [ngStyle]="{'background-image': 'url(' + workSpaceService.presentationTheme.ThemeBackgroundImage?.themeBackgroundImageCroppedUrl + ')','opacity':workSpaceService.presentationTheme.ThemeBackgroundImage?.themeBackgroundImageCroppedUrl ? workSpaceService.presentationTheme.backgroundColorOpacity:1,'background-size':workSpaceService.presentationTheme.ThemeBackgroundImage?.themeBackgroundImageCroppedUrl ? '100% 100%' : 'cover'}">
                        </div>
                    </ng-container>
                    <div class="content-center-panel" [ngStyle]='{ height : panelHeight }'>
                        <ng-container *ngIf="workSpaceService.presentationTheme?.ThemeLogo?.logoCroppedUrl">
                            <div class="brand-logo" [style.width]="logoPositionType =='Landscape'? '15%':'5%'">
                                <div class="logo-icon">
                                    <img [src]="workSpaceService.presentationTheme?.ThemeLogo?.logoCroppedUrl" [alt]="workSpaceService.presentationTheme?.ThemeLogo?.logoCroppedUrl" class="logo-image">
                                </div>
                            </div>
                        </ng-container>
                        <ng-container *ngIf="centerPanelLoading">
                            <app-center-panel-skeleton></app-center-panel-skeleton>
                        </ng-container>
                        <ng-container *ngIf="!centerPanelLoading">
                            <div [ngClass]="this.imageType == 'Image left' || this.imageType == 'Side by side left' ? 'inside-content-panel-left' : 'inside-content-panel-right'">
                                <div *ngIf="this.imageType == 'Image right' || this.imageType == 'Image left'" class="background-left-right-image" [ngStyle]="loadBGLayout()"></div>
                                <div *ngIf="this.imageType == 'Side by side right' || this.imageType == 'Side by side left'" class="background-slide-by-slide-left-right-image" [ngStyle]="loadBGLayout()"></div>
                                <div [ngClass]="{'background-image-panel-top': imageType == 'Image top', 'background-image-panel-bottom': imageType == 'Image bottom', 'background-image-panel': imageType != 'Image top' && imageType != 'Image bottom', 'img-opacity': imageType === 'Full Image' && !activePptImage && !workSpaceService.isPdf && workSpaceService.activeSlideTypeName !=masterSlideTypeName.POWER_POINT && workSpaceService.activeSlideTypeName !=masterSlideTypeName.GoogleSlides && workSpaceService.activeSlideTypeName !=masterSlideTypeName.INSTRUCTION_SLIDE_TYPE}">
                                    <div *ngIf="(imageType === 'Full Image') && !showPdf" [ngStyle]="{'background-image': 'url(' + (workSpaceService.slideLayoutImage || '/assets/images/static_bg_image.svg') + ')','width': '100%','position': 'absolute', 'height': '100%','opacity': workSpaceService.slideLayoutImageOpacity,'background-position': 'center center','background-repeat': 'no-repeat','background-size': workSpaceService.slideLayoutImage ? '100% 100%' : 'cover'}"></div>
                                    <!-- <div class="opacity-point-seven" *ngIf="this.imageType == 'Full Image' && workSpaceService?.slideContentImage && workSpaceService.activeSlideTypeName != 'Import Document'" [ngStyle]="{'background-position': 'center center', 'background-repeat': 'no-repeat', 'background-size': 'cover'}"></div> -->
                                    <div class="inner-top-bottom-image" *ngIf="imageType == 'Image top' || imageType == 'Image bottom'" [ngStyle]="loadBGLayout()"></div>
                                    <img 
                                    #slideImage 
                                    [src]="slidePdfImage" 
                                    (load)="checkImageOrientation($event)" 
                                    *ngIf="showPdf" 
                                    [ngClass]="imageOrientationClass"
                                    draggable="false">
                                    <div class="center-chart-content">
                                        <div class="inside-chart-content">
                                            <div class="main-chart-area">
                                                <ng-container [ngClass]="workSpaceService?.slideListArray?.length > 0 ? '':'d-none'">
                                                    <div class="inside-chart-area" [ngStyle]="{'height': activeslideTypeName === masterSlideTypeName.OPEN_ENDED_SLIDE_TYPE ? '100%' : '100%'}">
                                                    
                                                            <div class="content-text-area" *ngIf="workSpaceService.activeSlideTypeName != masterSlideTypeName.MULTIMEDIA">
                                                                
                                                                <!-- [style.width]="(workSpaceService.presentationTheme?.ThemeLogo?.logoCroppedUrl) &&(this.imageType == 'Image left' || this.imageType == 'Side by side left'|| this.imageType == 'Full Image' || this.imageType == 'Default' ) ? '70%' : '100%'" -->
                                                                <ng-container *ngIf="!centerPanelLoading">
                                                                    <div class="inside-text-area" [style.width]="
                                                                    (workSpaceService.presentationTheme?.ThemeLogo?.logoCroppedUrl == null || workSpaceService.presentationTheme?.ThemeLogo?.logoCroppedUrl == '') ? '100%':
                                                                    (logoPositionType == 'Landscape' && (imageType == 'Image left' || imageType == 'Full Image' || imageType == 'Default')) ? '75%':
                                                                    (logoPositionType == 'Portrait'  && (imageType == 'Image left' || imageType == 'Full Image' || imageType == 'Default')) ? '90%':
                                                                    (logoPositionType == 'Landscape' && imageType == 'Side by side left')? '75%':
                                                                    (logoPositionType == 'Portrait' && imageType == 'Side by side left')? '90%':'100%'">
                                                                        <div class="text-area-div">
                                                                                <span id="font-style" class="font-styling-empty-class"
                                                                                    [ngClass]="(activeslideTypeName == masterSlideTypeName.POWER_POINT || activeslideTypeName == masterSlideTypeName.GoogleSlides) ? 'd-none' : ''">{{workSpaceService.questions}}</span>
                                                                            
                                                                        </div>
                                                                    </div>
                                                                </ng-container>
                                                            </div>
                                                                <div class="chart-content-area"> 
                                                                    <ng-container *ngIf="!centerPanelLoading">
                                                                        <app-dynamic-slide-type
                                                                        #dynamicSlideComponent
                                                                        [activeSlideTypeId]="workSpaceService.currentMasterSlideTypeId"
                                                                        [activeslideVisualizationId]="workSpaceService.currentActiveSlide?.design?.slideVisualizationId"
                                                                        [slideDetails]="workSpaceService.currentActiveSlide"
                                                                        [template]="workSpaceService.currentPresentation"
                                                                        [presentationTheme]="workSpaceService.currentPresentation?.presentationThemes"
                                                                        [viewfrom]="'editPresentation'"
                                                                        [screenOptions]="'newPresentation'"
                                                                        [isPresenterEditorScreen]="true"
                                                                        [isPreview]="false"
                                                                        ></app-dynamic-slide-type>  
                                                                    </ng-container>
                                                                </div>
                                                    </div>
                                                </ng-container>
                                                <ng-container *ngIf="workSpaceService?.slideListArray?.length != 0">
                                                    <!-- Multiple Choices Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/multipleBarSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Word Cloud Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/wordCloudSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Loop Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/loopSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Brether Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/bretherSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Timer Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/timerSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Spin The Wheel Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/spinthewheelSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Quote Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/quoteSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- QR Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/qrSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Q&A Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/qaSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Select Answer Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/selectanswerSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Scale Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/scaleSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Arrow Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/arrowSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- pin on image Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/pinonimageSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- 2X2 Grid Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/2x2gridSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Type Answer Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/typeanswerSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Ranking Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/rankingSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Timeline Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/timelineSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Open Ended Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/openendedSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- This or That Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/thisorthatSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- image Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/imageSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- paragraph Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/paraghrapSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- heading Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/headingSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- video Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/videoSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Big Text Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/bigtextSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Bullet Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/bulletSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Who Will Win Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/whowillwinSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Drum Roll Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/drumrollSvg.svg" class="img-fluid">
                                                    </div>
                                                    <!-- Traffic Hover Svg -->
                                                    <div class="inside-chart-area d-none">
                                                        <img src="/assets/new-icons/hoverSvg/trafficSvg.svg" class="img-fluid">
                                                    </div>
                                                </ng-container>
                                            </div>
                                            
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </ng-container>
                        <div class="right-side-icon-section" *ngIf="workSpaceService?.slideListArray?.length != 0">
                            <div class="position-menu-bottom-lasts">
                                <!-- *========= Reaction Display ========= -->
                                <div class="d-flex justify-content-between align-items-center">
                                    <app-reactions class="d-flex justify-content-between align-items-center" [presentationReactions]="workSpaceService.presentationSettingActiveReactions"></app-reactions>
                                    <!-- *========= Voter Count Display ========= -->

                                        <button class="btn btn-list-menu center-panel-icon-section d-flex justify-content-between align-items-center tooltip-top" data-tooltip="Voter">

                                    <!-- *========= Question Count Display ========= -->
                                    <div class="position-menu-bottom-info-toolbar position-menu-bottom-info-toolbar-icon" [ngClass]="workSpaceService.slideShowQuestions == true ? '':'d-none'" *ngIf="workSpaceService.OnlyQA != true || workSpaceService.activeSlideTypeName == masterSlideTypeName.QUESTIONS_AND_ANSWER_SLIDE_TYPE">

                                            <span class="position-text user-count-number-section">{{workSpaceService.presentationQuestionsLegnth}}</span>

                                    <!-- * ========= Show alert when hide the response =========-->
                                    <div class="position-menu-bottom-info" [style.color]="workSpaceService.presentationTheme?.ThemeTextColor"
                                        [class.active]="!workSpaceService.slideEnableVoting"
                                        [style.bottom]="(workSpaceService.slideEnableVoting) ? '40px' : '70px'"
                                        *ngIf="!workSpaceService.slideEnableVoting && workSpaceService?.slideListArray?.length != 0">
                                        <div class="d-flex justify-content-center align-items-center p-1 w-100">
                                            <div class="d-block text-center">
                                                <p class="fs-10 mb-0">Response is off</p>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- * ========= Show alert when hide the results =========-->
                                    <div class="position-menu-bottom-info" [style.color]="workSpaceService.presentationTheme?.ThemeTextColor"
                                        [class.active]="!workSpaceService.slideShowInResults"
                                        [style.bottom]="(workSpaceService.slideShowInResults) ? '70px' : '40px'"
                                        *ngIf="(!workSpaceService.slideShowInResults && workSpaceService?.slideListArray?.length != 0) && (workSpaceService.slideContentType != workSpaceService.masterSlideTypeName.QUIZ && workSpaceService.activeSlideTypeName !== masterSlideTypeName.ImportDocument && workSpaceService.activeSlideTypeName !== masterSlideTypeName.POWER_POINT && workSpaceService.activeSlideTypeName !== masterSlideTypeName.GoogleSlides && workSpaceService.activeSlideTypeName !== masterSlideTypeName.INSTRUCTION_SLIDE_TYPE && workSpaceService.activeSlideTypeName !== masterSlideTypeName.MULTIMEDIA)">
                                        <div class="d-flex justify-content-center align-items-center p-1 w-100">
                                            <div class="d-block text-center">
                                                <p class="fs-10 mb-0">Responses are hidden</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div>
        <div class="speaker-notes" *ngIf="isSpeakerNoteShow || workSpaceService.slideCount > 0">
            <div *ngIf="isSpeakerNoteShow">
                <img src="/assets/new-icons/pill-shade.svg" class="img-fluid mx-auto mb-2">
                <button class="btn p-0 position-absolute-close" (click)="toggleTextarea()">
                    <img src="/assets/new-icons/close.svg" width="16" height="16" class="img-fluid">
                </button>
            </div>
            <div class="position-relative" (click)="toggleTextarea()">
                <span class="position-relative-span cursor-pointer">
                    On-Slide Notes
                    <!-- add condition in bottom of sapn like if user enter the speaker notes on any show this sapn -->
                    <ng-container *ngIf="workSpaceService.presentationSpeakerNotes?.length > 0">
                        <span class="position-absolute-notification">
                            <img src="/assets/new-icons/notifiy.svg" class="img-fluid">
                        </span>
                    </ng-container>
                </span>
            </div>
            <textarea *ngIf="isSpeakerNoteShow"
             class="textarea-content-div"
             placeholder="Store reminders, talking points, or key notes for this slide here."
             [(ngModel)]="workSpaceService.presentationSpeakerNotes"
             [ngModelOptions]="{standalone: true}"
             (focusout)="presentationSpeakerNoteUpdate()"
             ></textarea>
        </div>
    </div>
</section>
